services:
  postgres-test:
    image: postgres:17-alpine
    container_name: nexterp-pg-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexterp_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexterp_test"]
      interval: 2s
      timeout: 3s
      retries: 15
